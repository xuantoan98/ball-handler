name: ball_handler
description: "Little Shadow Theatre — a moonlit shadow puzzle game."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.5.1
  flutter:
    sdk: flutter
  google_mobile_ads: ^9.2.0
  shared_preferences: ^2.5.6
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
  assets:
    - assets/backgrounds/
    - assets/controls/
    - assets/audio/

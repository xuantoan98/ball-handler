name: ball_handler
description: "Người điều khiển bóng — Flutter M3 gameplay prototype."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
  assets:
    - assets/backgrounds/
